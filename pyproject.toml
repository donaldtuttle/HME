[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "holographic-memory-engine"
version = "3.1.0"
description = "Standalone FFT-pattern associative memory with an artifact ledger and ranked retrieval"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]
legacy-test = ["pytest>=8", "Pillow>=10"]
dynamics = ["Pillow>=10"]
visualization = ["matplotlib>=3.7", "Pillow>=10"]

[project.scripts]
hme = "hme_engine:main"

[tool.setuptools]
py-modules = ["hme_engine", "hme_runtime", "hme_dynamics", "hme_consolidation"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
