name: Validate field-only consolidation Step 0
on:
  push:
    branches: [develop/consolidation-step0]
    paths: [.github/workflows/consolidation-stage.yml]
permissions:
  contents: write
concurrency:
  group: consolidation-step0
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sources and prepare final branch
        run: |
          sha256sum -c SOURCE_PINS.sha256
          sha256sum -c archive/v2.2.sha256
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {'hme_consolidation.py':'2d445533aef1e7afa51113db4f2f9945a8c80cf4f743b851aec60c881bfd1a6d', 'tests/test_consolidation.py':'5ae156d3270907bb8164a6a9092d117784bcdef14b9e72afefc15ef60922f5b5', 'scripts/check_consolidation.py':'40ac11396086ca54eb95a3012bb3f275269121bc09a579d3a370e489c0221e95'}
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          p=Path('pyproject.toml'); t=p.read_text()
          old='py-modules = ["hme_engine", "hme_runtime", "hme_dynamics"]'
          assert old in t
          p.write_text(t.replace(old,'py-modules = ["hme_engine", "hme_runtime", "hme_dynamics", "hme_consolidation"]'))
          p=Path('README.md'); t=p.read_text()
          needle='## Documentation\n'
          assert needle in t
          note=('## Field-only consolidation (DEVELOP)\n\n'
                'The opt-in [consolidation adapter](docs/CONSOLIDATION.md) can discard its owned\n'
                'records, payload/pattern caches and lineage while retaining the unchanged field.\n'
                'Later writes remain field-only. Fixed-width weight metadata supports weighted\n'
                'numerical reconstruction and a complete field-only checkpoint. This is Step-0\n'
                'invariant validation, not a salience, damage-tolerance or semantic-memory result.\n'
                'The [study plan](experiments/consolidation_plan/README.md) separates those questions.\n\n')
          p.write_text(t.replace(needle,note+needle,1))
          Path('.github/workflows/consolidation-stage.yml').unlink()
          PY
          git add -A
          python scripts/update_manifest.py
          git add MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
      - name: Validate exact candidate and generate invariant evidence
        run: |
          python -m pip install -e '.[test,legacy-test,visualization]'
          mkdir -p outputs
          python -m pytest -q --junitxml=outputs/consolidation-tests.xml
          (cd archive/v2.2 && python -m pytest -q --junitxml=../../outputs/consolidation-historical.xml)
          hme --self-test
          python scripts/check_consolidation.py --output evidence/consolidation_step0.json
          python -m pip wheel --no-deps . -w outputs/wheels
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel=next(Path('outputs/wheels').glob('*.whl'))
          with ZipFile(wheel) as z:
              assert 'hme_consolidation.py' in z.namelist()
          PY
      - name: Publish validated adapter and complete manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/consolidation_step0.json
          python scripts/update_manifest.py
          git add MANIFEST.sha256
          sha256sum -c MANIFEST.sha256
          sha256sum -c SOURCE_PINS.sha256
          (cd experiments/reconstruction_v1 && sha256sum -c RESULTS.sha256)
          git commit -m 'Validate bounded consolidation state, package adapter and publish invariant evidence'
          git push origin HEAD:develop/consolidation-step0
          git rev-parse HEAD > outputs/consolidation-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-step0-${{ github.run_id }}
          path: |
            outputs/*.xml
            outputs/*.txt
            evidence/consolidation_step0.json
          retention-days: 30
