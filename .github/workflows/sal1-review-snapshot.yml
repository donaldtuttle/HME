name: SAL1 policy review snapshot
on:
  push:
    branches: [develop/sal1-surprise-buffer]
    paths: [.github/workflows/sal1-review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact source without redundant large fixture
        run: |
          mkdir -p /tmp/sal1-review
          git archive --format=zip --output=/tmp/sal1-review/source.zip HEAD -- . ':!experiments/reconstruction_v1/raw_records.jsonl.gz'
          git rev-parse HEAD > /tmp/sal1-review/commit.txt
          git rev-parse HEAD^{tree} > /tmp/sal1-review/tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sal1-policy-review-source
          path: /tmp/sal1-review/
          retention-days: 7
