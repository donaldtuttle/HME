name: Publish HME v3.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - docs/releases/v3.1.0.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hme-release-v3.1.0
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'donaldtuttle/HME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Version and integrity gates
        run: |
          python -c 'import tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == "3.1.0"'
          sha256sum --check MANIFEST.sha256
          sha256sum --check SOURCE_PINS.sha256
          sha256sum --check archive/v2.2.sha256
          cmp --silent LICENSE skills/hme/LICENSE.txt
      - name: Validate release source
        run: |
          python -m pip install -e '.[test,legacy-test,visualization]'
          hme --self-test
          python -m pytest -q
          (cd archive/v2.2 && python -m pytest -q)
  publish:
    needs: validate
    if: github.repository == 'donaldtuttle/HME' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish once without replacing existing tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'v3.1.0 already published; leaving the existing release unchanged.'
            exit 0
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v3.1.0; then
            echo 'Existing v3.1.0 tag without a release: refusing to replace or reinterpret it.' >&2
            exit 1
          fi
          gh release create v3.1.0 --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title 'HME v3.1.0' \
            --notes-file docs/releases/v3.1.0.md --latest
