name: Apply and evaluate registered review
on:
  push:
    branches: [review/raw-vector-baseline-2026-09-25]
    paths: [.github/review-patch.zb64, .github/workflows/review-apply.yml]
permissions:
  contents: write
concurrency:
  group: hme-review-20260925
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integrity-checked patch
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, subprocess, zlib
          p = pathlib.Path('.github/review-patch.zb64')
          encoded = p.read_text()
          # Repair transport transcription; the decoded patch must match the local SHA.
          for a, b in [('RF/zPf3qxWqXqe', 'RF/zPf3qxWq0oXqe'), ('NabSj++ac2eOkMwn', 'NabSj++ac2OkMwn'), ('BlWBpFG0l0TQGez', 'BlWBpFG0TQGez')]:
              encoded = encoded.replace(a, b)
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '413b5c05abbdf0951df5ce462f12b71430ddb2a9a935e0b43f2606376bde00fa'
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply'],input=patch,check=True)
          p.unlink()
          pathlib.Path('.github/workflows/review-apply.yml').unlink()
          PY
          git diff --exit-code -- hme_engine.py hme_runtime.py hme_dynamics.py SOURCE_PINS.sha256 archive
          python scripts/update_manifest.py
          sha256sum --check MANIFEST.sha256
          sha256sum --check SOURCE_PINS.sha256
          sha256sum --check archive/v2.2.sha256
      - name: Test before evaluator publication
        run: |
          python -m pip install -e '.[test,legacy-test,visualization]'
          hme --self-test
          python -m pytest -q --junitxml=outputs/review-tests.xml
          (cd archive/v2.2 && python -m pytest -q)
      - name: Publish evaluator registration before running seeds
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Register HME-NN-3 evaluator and fix direct-checkout scripts'
          git push origin HEAD:review/raw-vector-baseline-2026-09-25
          git rev-parse HEAD > outputs/registration-commit.txt
      - name: Run registered evaluation
        run: |
          OPENBLAS_NUM_THREADS=1 python experiments/raw_vector_baseline_v1/evaluate.py --registration-commit "$(cat outputs/registration-commit.txt)" --output outputs/raw_vector_baseline_v1
      - name: Publish complete results separately
        run: |
          cp outputs/raw_vector_baseline_v1/* experiments/raw_vector_baseline_v1/
          python scripts/update_manifest.py
          sha256sum --check MANIFEST.sha256
          git add experiments/raw_vector_baseline_v1 MANIFEST.sha256
          git commit -m 'Report all 30 HME-NN-3 seeds and raw-vector baseline results'
          git push origin HEAD:review/raw-vector-baseline-2026-09-25
          git rev-parse HEAD > outputs/result-commit.txt
      - name: Exact source snapshot
        if: always()
        run: |
          mkdir -p outputs
          git archive --format=zip HEAD --output=outputs/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hme-review-evaluation
          path: outputs/
          retention-days: 14
