name: HME Plate demo

on:
  push:
    paths:
      - "demos/hme-plate/**"
      - "hme_engine.py"
      - ".github/workflows/hme-plate.yml"
  pull_request:
    paths:
      - "demos/hme-plate/**"
      - "hme_engine.py"
      - ".github/workflows/hme-plate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demos/hme-plate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: demos/hme-plate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install numpy==2.3.5
      - name: Model and DOM regressions
        run: npm test
      - name: Pinned Python compatibility
        run: npm run test:parity
      - name: Static build and packaging checks
        run: |
          npm run build
          npm run test:build
          npm run test:sites
      - name: Retain static demo and parity results
        uses: actions/upload-artifact@v4
        with:
          name: hme-plate-${{ github.sha }}
          path: |
            demos/hme-plate/dist/client/
            demos/hme-plate/outputs/parity.json
          if-no-files-found: error

  deploy-pages:
    name: deploy gh-pages
    needs: demo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested site
        uses: actions/download-artifact@v4
        with:
          name: hme-plate-${{ github.sha }}
          path: site-artifact
      - name: Publish tested site to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd site-artifact/dist/client
          touch .nojekyll
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m "Publish HME Plate ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
