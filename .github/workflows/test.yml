name: HME tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,sfd]"
      - name: Built-in self-test
        run: python qosmos_hme_engine.py --self-test
      - name: SFD to HME bridge diagnostic
        run: python integrations/sfd_to_hme_bridge.py --output outputs/sfd_hme_bridge.json
      - name: Pytest
        run: pytest -q
      - name: Independent HME audit
        run: python tests/hme_independent_audit.py --engine ./qosmos_hme_engine.py --output outputs/hme_audit.json
