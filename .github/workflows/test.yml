name: HME tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Payload and source integrity
        run: |
          sha256sum --check MANIFEST.sha256
          sha256sum --check SOURCE_PINS.sha256
          sha256sum --check archive/v2.2.sha256
      - name: License parity
        run: cmp --silent LICENSE skills/hme/LICENSE.txt
      - name: Install
        run: python -m pip install -e ".[test,legacy-test]"
      - name: Built-in self-test
        run: hme --self-test
      - name: Pytest
        run: python -m pytest -q
      - name: Retrieval audit
        run: python tests/hme_independent_audit.py --engine ./hme_engine.py --output outputs/hme_audit.json
      - name: Historical source and behavior
        working-directory: archive/v2.2
        run: |
          sha256sum --check SOURCE_PINS.sha256
          python -m pytest -q
          python integrations/sfd_to_hme_bridge.py --output outputs/sfd_hme_bridge.json
