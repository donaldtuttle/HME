name: HME bridge variant diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test,sfd]"
      - name: Bridge before pytest
        run: python -c "from integrations.sfd_to_hme_bridge import run_bridge; import json; print(json.dumps(run_bridge(), indent=2, ensure_ascii=False))"
      - name: Pytest diagnostic
        continue-on-error: true
        run: pytest -q
      - name: Bridge after pytest
        if: always()
        run: python -c "from integrations.sfd_to_hme_bridge import run_bridge; import json; print(json.dumps(run_bridge(), indent=2, ensure_ascii=False))"
