name: Final manifest hash diagnostic

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print changed release-bearing hashes
        run: |
          sha256sum \
            CHANGELOG.md \
            README.md \
            docs/RELEASE_PLAN.md \
            docs/REPRODUCIBILITY.md \
            evidence/bridge_active_engine_validation_2026-08-24.json \
            integrations/sfd_to_hme_bridge.py \
            tests/test_sfd_bridge.py
