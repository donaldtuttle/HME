name: Review source snapshot
on:
  push:
    branches: [review/raw-vector-baseline-2026-09-25]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact review sources
        run: git archive --format=zip HEAD --output=source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: review-source-${{ github.sha }}
          path: source.zip
          retention-days: 7
