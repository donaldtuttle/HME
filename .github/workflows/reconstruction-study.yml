name: HME-REC-1 registered reconstruction
on:
  push:
    branches: [experiment/reconstruction-v1]
    paths:
      - experiments/reconstruction_v1/evaluate.py
      - experiments/reconstruction_v1/protocol.json
      - experiments/reconstruction_v1/PROTOCOL.md
      - tests/test_reconstruction.py
      - .github/workflows/reconstruction-study.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: hme-rec1-registration
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correctness and pinned-source validation before evaluation
        run: |
          test ! -f experiments/reconstruction_v1/REPORT.md
          sha256sum -c MANIFEST.sha256
          sha256sum -c SOURCE_PINS.sha256
          sha256sum -c archive/v2.2.sha256
          python -m pip install -e '.[test,legacy-test,visualization]'
          mkdir -p outputs
          python -m pytest -q --junitxml=outputs/rec1-tests.xml
          (cd archive/v2.2 && python -m pytest -q --junitxml=../../outputs/rec1-historical-tests.xml)
          hme --self-test
      - name: Publish complete registration manifest before evaluation
        id: registration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/update_manifest.py
          git add MANIFEST.sha256
          git commit -m 'Complete HME-REC-1 preregistration manifest before evaluation'
          git push origin HEAD:experiment/reconstruction-v1
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > outputs/rec1-registration-commit.txt
          git archive HEAD --format=zip --output=outputs/rec1-registration-source.zip
      - name: Run frozen remote-verified study
        run: |
          python experiments/reconstruction_v1/evaluate.py \
            --registration-commit '${{ steps.registration.outputs.sha }}' \
            --output outputs/reconstruction_v1
      - name: Publish every result without changing registered sources
        run: |
          cp outputs/reconstruction_v1/* experiments/reconstruction_v1/
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text()
          paragraph=('The new [HME-REC-1 reconstruction study](experiments/reconstruction_v1/REPORT.md)\n'
            'tests recovery of missing coordinates in unseen correlated signals, with NN copying,\n'
            'weighted blending, a direct second-moment control, identity checks and measured costs.\n'
            'Its field readout is experimental; the released engine and defaults are unchanged.\n\n')
          p.write_text(text.replace('## Evidence and limitations\n\n','## Evidence and limitations\n\n'+paragraph,1))
          p=Path('docs/EVIDENCE.md')
          p.write_text(p.read_text()+'\n## HME-REC-1: partial-observation reconstruction\n\n'
            'See [protocol](../experiments/reconstruction_v1/PROTOCOL.md), '
            '[report](../experiments/reconstruction_v1/REPORT.md), '
            '[raw predictions](../experiments/reconstruction_v1/raw_records.jsonl.gz) and '
            '[results](../experiments/reconstruction_v1/results.json). '
            'The official run checks fresh canonical-origin visibility before evaluation. '
            'Direct second moments are an explicit algebraic control, not an omitted baseline.\n')
          PY
          python scripts/update_manifest.py
          sha256sum -c MANIFEST.sha256
          sha256sum -c SOURCE_PINS.sha256
          (cd experiments/reconstruction_v1 && sha256sum -c RESULTS.sha256)
          git add experiments/reconstruction_v1 README.md docs/EVIDENCE.md MANIFEST.sha256
          git commit -m 'Report all HME-REC-1 reconstruction cells, controls, identity and costs'
          git push origin HEAD:experiment/reconstruction-v1
          git rev-parse HEAD > outputs/rec1-result-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hme-rec1-${{ github.run_id }}
          path: outputs/
          retention-days: 30
