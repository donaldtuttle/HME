name: Finalize review documentation
on:
  push:
    branches: [review/raw-vector-baseline-2026-09-25]
    paths: [.github/review-finalize.py, .github/review-crosscheck.json, .github/workflows/review-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finalize source and documentation
        run: |
          python .github/review-finalize.py
          git diff --exit-code -- hme_engine.py hme_runtime.py hme_dynamics.py SOURCE_PINS.sha256 SOURCE_PROVENANCE.json archive experiments/raw_vector_baseline_v1 tests/test_raw_vector_baseline.py
          python scripts/update_manifest.py
          sha256sum --check MANIFEST.sha256
          sha256sum --check SOURCE_PINS.sha256
          sha256sum --check archive/v2.2.sha256
          cmp --silent LICENSE skills/hme/LICENSE.txt
      - name: Test complete source
        run: |
          python -m pip install -e '.[test,legacy-test,visualization]'
          hme --self-test
          python -m pytest -q --junitxml=outputs/final-tests.xml
          (cd archive/v2.2 && python -m pytest -q)
      - name: Publish reviewed documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Document raw-input findings and prepare guarded v3.1.0 release'
          git push origin HEAD:review/raw-vector-baseline-2026-09-25
          git rev-parse HEAD > outputs/final-commit.txt
          git archive --format=zip HEAD --output=outputs/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hme-final-review
          path: outputs/
          retention-days: 14
