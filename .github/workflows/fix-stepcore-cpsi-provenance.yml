name: Fix step_core Cpsi provenance

on:
  push:
    paths:
      - '.github/workflows/fix-stepcore-cpsi-provenance.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply provenance correction and refresh pins
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          def rep(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one anchor, got {text.count(old)}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          rep(
              'qosmos_hme_engine.py',
              '''            metadata={
                "source_glyph": glyph,
                "observer_id": observer_id,
                "psi_meta": psi_meta_value,
                "c_psi": float(c_psi),
                "collapsed": collapse_event is not None,
                "rsbt_map": rsbt_map,
                **dict(metadata or {}),
            },
''',
              '''            metadata={
                **dict(metadata or {}),
                "source_glyph": glyph,
                "observer_id": observer_id,
                "psi_meta": psi_meta_value,
                "c_psi": float(c_psi),
                "collapsed": collapse_event is not None,
                "rsbt_map": rsbt_map,
            },
''',
              'step_core metadata ownership',
          )

          engine = Path('qosmos_hme_engine.py')
          new_hash = hashlib.sha256(engine.read_bytes()).hexdigest()
          # Find and replace the current active engine pin instead of hard-coding a prior run.
          skill = Path('skills/hme/SKILL.md')
          skill_text = skill.read_text(encoding='utf-8')
          marker = 'Active source pin (SHA-256):\n\n    '
          start = skill_text.index(marker) + len(marker)
          old_hash = skill_text[start:start+64]
          if len(old_hash) != 64:
              raise SystemExit('active source pin malformed')
          for name in ['skills/hme/SKILL.md', 'tests/test_hme_engine.py', 'docs/agent-skill.md']:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              if old_hash in text:
                  p.write_text(text.replace(old_hash, new_hash), encoding='utf-8')

          changed = ['qosmos_hme_engine.py','skills/hme/SKILL.md','tests/test_hme_engine.py','docs/agent-skill.md']
          manifest = Path('MANIFEST.sha256')
          lines = manifest.read_text(encoding='utf-8').splitlines()
          digests = {p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in changed}
          found = set()
          out = []
          for line in lines:
              parts = line.split('  ', 1)
              if len(parts) == 2 and parts[1] in digests:
                  out.append(f'{digests[parts[1]]}  {parts[1]}')
                  found.add(parts[1])
              else:
                  out.append(line)
          if found != set(changed):
              raise SystemExit(f'manifest missing changed paths: {set(changed)-found}')
          manifest.write_text('\n'.join(out) + '\n', encoding='utf-8')
          print('engine_sha256', new_hash)
          PY
      - name: Verify DEVELOP contract
        run: |
          python qosmos_hme_engine.py --self-test
          python -m pytest tests/test_hme_engine.py -q
          python - <<'PY'
          from qosmos_hme_engine import QOSMOSCoreHME
          e = QOSMOSCoreHME(memory_size=24, encoding_resolution=8, seed=9)
          r = e.step_core('Ξ', phi=1.0, rho=1.0, dS=0.0, collapse_override=False, metadata={'c_psi': -999.0})
          assert r.memory_artifact is not None
          assert r.memory_artifact.metadata['c_psi'] == r.meta.c_psi
          assert r.memory_artifact.metadata['c_psi'] != -999.0
          print('step_core c_psi provenance PASS')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-stepcore-cpsi-provenance.yml
          git add qosmos_hme_engine.py skills/hme/SKILL.md tests/test_hme_engine.py docs/agent-skill.md MANIFEST.sha256
          git commit -m "Lock step_core C(psi) provenance ownership" -m "Prevent caller metadata from overriding the engine-computed write-time c_psi in the core adapter. DEVELOP only; no efficacy claim."
          git push
