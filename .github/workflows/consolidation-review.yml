name: Consolidation review source
on:
  push:
    branches: [develop/consolidation-step0]
    paths: [.github/workflows/consolidation-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive HEAD --format=zip --output=/tmp/consolidation-review-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: consolidation-review-source
          path: /tmp/consolidation-review-source.zip
          retention-days: 7
