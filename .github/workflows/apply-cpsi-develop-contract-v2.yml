name: Apply HME Cpsi DEVELOP contract v2

on:
  push:
    paths:
      - '.github/workflows/apply-cpsi-develop-contract-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply paired engine and skill patch
        run: python scripts/apply_cpsi_develop_patch.py
      - name: Verify engine self-test and repository tests
        run: |
          python qosmos_hme_engine.py --self-test
          python -m pytest -q
      - name: Commit verified paired DEVELOP patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-cpsi-develop-contract.yml
          git rm .github/workflows/apply-cpsi-develop-contract-v2.yml
          git rm scripts/apply_cpsi_develop_patch.py
          git add qosmos_hme_engine.py skills/hme/SKILL.md tests/test_hme_engine.py docs/agent-skill.md MANIFEST.sha256
          git commit -m "Apply C(psi) DEVELOP salience contract" -m "Gate NO_MATCH on base relevance before optional salience, keep retrieval scores ephemeral, persist write-time c_psi provenance, preserve LOW_INSCRIPTION_SALIENCE hits, and keep all salience switches disabled by default. No efficacy claim; C0-C7 remains required."
          git push
